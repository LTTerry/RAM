name: Daily Market Data Sync

on:
  push:
    branches: [ "main", "master" ]
  schedule:
    # Runs every day at 08:00 AM UTC+8 (Hong Kong Time) -> 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Market Data Update Script
        run: npm run update-data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID || secrets.EBAY_CLIENT_ID || secrets.EBAY_APPID || secrets.EBAY_CLIENTID || secrets.EBAY_KEY }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID || secrets.EBAY_CLIENT_SECRET || secrets.EBAY_CERTID || secrets.EBAY_SECRET || secrets.EBAY_CERT }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID || secrets.EBAY_APP_ID || secrets.EBAY_APPID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET || secrets.EBAY_CERT_ID || secrets.EBAY_SECRET }}
          EBAY_APPID: ${{ secrets.EBAY_APPID || secrets.EBAY_APP_ID }}
          EBAY_CERTID: ${{ secrets.EBAY_CERTID || secrets.EBAY_CERT_ID }}

      - name: Commit Updated Market Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/market-data.json
          git add -f public/ebay-sync.log
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated market data sync [skip ci]" && git push)

      - name: Build React Application
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
